[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
solc = "0.8.23"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./"}]

remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "@tokenized-strategy/=lib/tokenized-strategy/src/",
  "@periphery/=lib/tokenized-strategy-periphery/src/",
]

[fuzz]
runs = 256

[rpc_endpoints]
base = "${BASE_RPC_URL}"
mainnet = "${ETH_RPC_URL}"

[profile.ci]
fuzz = { runs = 100 }
